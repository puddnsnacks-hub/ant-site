<!doctype html>
<html lang="en" data-theme="pds">
<head>
<script src="gate-config.js"></script><script src="gate.js"></script><meta charset="utf-8"><base target="_blank"><meta name="viewport" content="width=device-width, initial-scale=1"><title>The cut panel beside the painting</title>
<link rel="stylesheet" href="assets/type/pds-fonts.css">
<link rel="stylesheet" href="assets/type/pds-faces.css">
<link rel="stylesheet" href="assets/type/pds-type.css">
<link rel="stylesheet" href="assets/fonts.css">
<link rel="stylesheet" href="assets/aods/dist/tokens.css">
<link rel="stylesheet" href="assets/pds/theme.css">
<link rel="stylesheet" href="assets/aods/dist/aods.css">
<link rel="stylesheet" href="assets/pds/layer-tokens.css">
<link rel="stylesheet" href="assets/pds/layer.css">
<link rel="stylesheet" href="assets/suite.css">
<link rel="stylesheet" href="custom/maxine-spot.css">
<link rel="stylesheet" href="custom/maxine-wall.css">
<style>html,body{margin:0;background:#fff8eb}html{overflow-x:hidden}body{padding:24px;min-height:0;display:block}body>*{max-width:100%;min-width:0;box-sizing:border-box}@media (max-width:520px){body{padding:12px}}</style></head>
<body class="s-page">
<div class="x-maxine-spot" id="x-maxine-spot">
  <p class="x-maxine-spot__howto" id="x-maxine-spot-howto">Tap a numbered mark on the cut panel.</p>
  <div class="x-maxine-spot__stage">
    <figure class="x-maxine-spot__fig">
      <p class="x-maxine-spot__tag">Cut</p>
      <div class="x-maxine-spot__pic">
        <img src="img/maxine/spot-panel.jpg" width="448" height="560" alt="A panel from the cut sheet: Maxine hugging her basket of crickets, in a dress with a white collar, buttons and puffed sleeves, small faint dots, a plain green throat, and four fingers wrapped around the basket." />
        <div class="x-maxine-spot__marks" role="radiogroup" aria-labelledby="x-maxine-spot-howto">
          <button type="button" role="radio" aria-checked="true" class="x-maxine-spot__mark" style="left:55%;top:36%" data-i="0" aria-label="1, the throat">1</button>
          <button type="button" role="radio" aria-checked="false" class="x-maxine-spot__mark" style="left:77%;top:45%" data-i="1" aria-label="2, the dress shape">2</button>
          <button type="button" role="radio" aria-checked="false" class="x-maxine-spot__mark" style="left:22%;top:72%" data-i="2" aria-label="3, the hands">3</button>
          <button type="button" role="radio" aria-checked="false" class="x-maxine-spot__mark" style="left:86%;top:65%" data-i="3" aria-label="4, the dots">4</button>
        </div>
      </div>
    </figure>
      <div class="x-maxine-spot__out" aria-live="polite">
        <p class="x-maxine-spot__n"><span data-x="n">1</span> · <span data-x="title">The throat</span></p>
        <dl class="x-maxine-spot__dl">
          <dt>Cut panel</dt><dd data-x="cut"></dd>
          <dt>Painting</dt><dd data-x="paint"></dd>
          <dt>The lock</dt><dd data-x="lock"></dd>
        </dl>
      </div>
      <figure class="x-maxine-spot__ref">
        <p class="x-maxine-spot__tag x-maxine-spot__tag--ok">Painting</p>
        <img src="img/maxine/painting-spot.jpg" width="464" height="580" alt="Detail of the original painting from head to basket: white stippled throat with cream spade scales, a sleeveless A-line dress with large purple dots, thin green arms." loading="lazy" />
      </figure>
  </div>
</div>
<script src="assets/aods/dist/aods.js"></script>
<script src="custom/maxine-spot.js"></script>
<script>(function(){function h(){parent.postMessage({xframe:location.pathname.split('/').pop(),h:document.documentElement.scrollHeight},'*')}
new ResizeObserver(h).observe(document.body);addEventListener('load',h);h()})();</script>
</body></html>
